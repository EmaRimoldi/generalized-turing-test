name: Deploy Epsilon Visualizer

on:
  push:
    branches:
      - main
    paths:
      - "visualizer/web/**"
      - "visualizer/python/**"
      - "visualizer/scripts/**"
      - ".github/workflows/deploy-epsilon-visualizer.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: visualizer/web/package-lock.json

      - name: Build frontend and Condition A+B data
        working-directory: visualizer/web
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: visualizer/web/dist

      - uses: actions/deploy-pages@v4
        id: deployment
